<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>British Hills English Quest v2</title>
    <!-- Loads Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* 🎬 CSS ANIMATIONS */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes popIn { 0% { transform: scale(0.95) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }

        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }
        .animate-pop-in { animation: popIn 0.4s ease-out forwards; }
        
        body { -webkit-user-select: none; user-select: none; overflow: hidden; background-color: #000; }

        /* Custom Toggle Switch for Japanese Translation */
        .toggle-checkbox:checked { right: 0; border-color: #10B981; }
        .toggle-checkbox:checked + .toggle-label { background-color: #10B981; }
    </style>
</head>
<body class="font-sans antialiased text-gray-900 h-[100dvh] w-full">

    <div id="app" class="w-full h-full relative"></div>

    <script>
        // ==========================================
        // 🎨 ASSET CONFIGURATION
        // ==========================================
        const ASSETS = {
            backgrounds: {
                manorHouse: "assets/manorhouse.jpg",
                tearoom: "assets/tearoom.jpg",
                snookerRoom: "assets/snooker.jpg",
                library: "assets/library.jpg",
                refectory: "assets/refectory.jpg"
            },
            characters: {
                receptionist: "assets/receptionist.gif",
                receptionist2: "assets/receptionist2.gif",
                waiter: "assets/waiter.gif",
                snookerPlayer: "assets/snookerplayer.gif",
                snookerPlayer2: "assets/snookerplayer2.gif",
                librarian: "assets/librarian.gif",
                chef: "assets/chef.gif",
                chef2: "assets/chef2.gif"
            }
        };

        // ==========================================
        // 📚 EDUCATIONAL DATA (Dictionary & Info)
        // ==========================================
        const DICTIONARY = {
            "antique": { eng: "A collectible object that has a high value because of its age.", jp: "骨董品" },
            "Lord": { eng: "A man of noble rank or high office.", jp: "卿、君主" },
            "Snooker": { eng: "A British game played with cues on a billiard table.", jp: "スヌーカー (ビリヤードの一種)" },
            "Refectory": { eng: "A room used for communal meals in an educational institution.", jp: "食堂" },
            "impeccable": { eng: "In accordance with the highest standards; faultless.", jp: "完璧な" },
            "culture": { eng: "The arts, customs, and habits that characterize a particular society or nation.", jp: "文化" },
            "polite": { eng: "Having or showing behavior that is respectful and considerate of other people.", jp: "礼儀正しい" },
            "aristocracy": { eng: "The highest class in certain societies, typically comprising people of noble birth.", jp: "貴族階級" },
            "refined": { eng: "Elegant and cultured in appearance, manner, or taste.", jp: "洗練された" },
            "prestigious": { eng: "Inspiring respect and admiration; having high status.", jp: "一流の、名声のある" }
        };

        const LOCATION_INFO = {
            manorHouse: { title: "The Manor House", text: "The heart of British Hills. It is modeled after the traditional country estates of the British [aristocracy], featuring genuine [antique] furniture and wood imported from England." },
            tearoom: { title: "Ascot Tearoom", text: "A relaxing place to enjoy traditional British afternoon tea, featuring fresh scones, clotted cream, and many varieties of fine tea." },
            snookerRoom: { title: "Snooker Room", text: "A classic gentleman's game room. Snooker is a type of billiards. It originated in the late 19th century in India, during the British Raj, and is popular around the world but especially the UK and India. It requires a lot of skill and patience!" },
            library: { title: "The Library", text: "The Manor House library is filled with [antique] books, cozy furniture, and a [refined] atmosphere." },
            refectory: { title: "The Refectory", text: "The grand dining hall. Its design was inspired by the refectories of [prestigious] British universities." }
        };

        // ==========================================
        // 📖 STORY & DIALOGUE DATA
        // ==========================================
        // Words wrapped in [brackets] will automatically become clickable dictionary links!
        const STORY = {
            start: {
                bg: 'manorHouse', char: 'receptionist', bgColor: 'bg-slate-800', charColor: 'bg-emerald-600',
                dialogue: [
                    { speaker: 'Ms. Davies', text: 'Welcome to British Hills! We hope you are enjoying your stay in our little slice of Britain.' },
                    { speaker: 'Ms. Davies', text: 'Actually, we have a slight emergency. One of the [Lord]\'s [antique] teacups has gone missing!', char: 'receptionist2' },
                    { speaker: 'Ms. Davies', text: 'We are very busy preparing for an English [culture] lesson. Could you please help us look for it?', char: 'receptionist2' }
                ],
                choices: [
                    { text: '"Yes, I would be happy to help."', next: 'start_reply', points: 10 },
                    { text: '"Yes, I want to find."', next: 'start_reply', points: 0 }
                ]
            },
            start_reply: {
                bg: 'manorHouse', char: 'receptionist2', bgColor: 'bg-slate-800', charColor: 'bg-emerald-600',
                dialogue: [
                    { speaker: 'Ms. Davies', text: 'Thank you so much! Please go to the Ascot Tearoom first, because that\'s where the [Lord]\'s [antique] teacups are usually kept.' }
                ],
                nextScene: 'tearoom'
            },
            tearoom: {
                bg: 'tearoom', char: 'waiter', bgColor: 'bg-orange-100', charColor: 'bg-blue-600',
                dialogue: [
                    { speaker: 'Waiter', text: 'Hello there! Welcome to the Ascot Tearoom.' },
                    { speaker: 'Waiter', text: 'A missing teacup? Oh dear, I haven\'t seen it in here.' },
                    { speaker: 'Waiter', text: 'But before you go looking elsewhere, would you like something to drink?' }
                ],
                choices: [
                    { text: '"May I have some tea, please?"', next: 'tearoom_clue', points: 10 },
                    { text: '"I want tea."', next: 'tearoom_clue', points: 0 }
                ]
            },
            tearoom_clue: {
                bg: 'tearoom', char: 'waiter', bgColor: 'bg-orange-100', charColor: 'bg-blue-600',
                dialogue: [
                    { speaker: 'Waiter', text: 'Certainly! Here is some of our finest Earl Grey.' },
                    { speaker: 'Waiter', text: 'By the way, I did see a guest carrying a shiny cup towards the Manor House earlier.' },
                    { speaker: 'Waiter', text: 'They mentioned they were going to play [Snooker]. You should check there!' }
                ],
                nextScene: 'snookerRoom'
            },
            snookerRoom: {
                bg: 'snookerRoom', char: 'snookerPlayer', bgColor: 'bg-amber-900', charColor: 'bg-red-700',
                dialogue: [
                    { speaker: 'Guest', text: 'Hello! Fancy a game of [Snooker]?' },
                    { speaker: 'Guest', text: 'Oh, you are looking for an [antique] teacup?' },
                    { speaker: 'Guest', text: 'I haven\'t seen it, but I can help you look. Put the words in order to ask for my help!' }
                ],
                builder: {
                    shuffled: ["help", "me?", "Could", "please", "you"],
                    correct: "Could you please help me?",
                    nextPass: 'snookerRoom_clue',
                    nextFail: 'snookerRoom_fail',
                    points: 10
                }
            },
            snookerRoom_fail: {
                bg: 'snookerRoom', char: 'snookerPlayer2', bgColor: 'bg-amber-900', charColor: 'bg-red-700',
                dialogue: [
                    { speaker: 'Guest', text: 'Ah, I think you meant to say: "Could you please help me?"' }
                ],
                nextScene: 'snookerRoom_clue'
            },
            snookerRoom_clue: {
                bg: 'snookerRoom', char: 'snookerPlayer2', bgColor: 'bg-amber-900', charColor: 'bg-red-700',
                dialogue: [
                    { speaker: 'Guest', text: 'Of course I can help! Actually, now that I think about it...' },
                    { speaker: 'Guest', text: 'I did see someone carrying a very fancy cup into the Library.' },
                    { speaker: 'Guest', text: 'Maybe you should check there?' }
                ],
                nextScene: 'library'
            },
            library: {
                bg: 'library', char: 'librarian', bgColor: 'bg-stone-800', charColor: 'bg-purple-700',
                dialogue: [
                    { speaker: 'Librarian', text: 'Welcome to the Library. Please keep your voice down.' },
                    { speaker: 'Librarian', text: 'A teacup? Yes, a student was using it while studying, but they just left.' },
                    { speaker: 'Librarian', text: 'If you want to know where they went, how should you ask?' }
                ],
                choices: [
                    { text: '"Could you tell me where they went, please?"', next: 'library_clue', points: 10 },
                    { text: '"Where did they go?"', next: 'library_clue', points: 0 }
                ]
            },
            library_clue: {
                bg: 'library', char: 'librarian', bgColor: 'bg-stone-800', charColor: 'bg-purple-700',
                dialogue: [
                    { speaker: 'Librarian', text: 'Well done. They said they were hungry and went to the [Refectory] to eat.' },
                    { speaker: 'Librarian', text: 'You should hurry and catch them!' }
                ],
                nextScene: 'refectory'
            },
            refectory: {
                bg: 'refectory', char: 'chef', bgColor: 'bg-red-900', charColor: 'bg-orange-500',
                dialogue: [
                    { speaker: 'Chef', text: 'Hello there! Welcome to the [Refectory].' },
                    { speaker: 'Chef', text: 'Oh, you are looking for this [antique] teacup? I found it on a table. Don\'t worry, it\'s fine!', char: 'chef2' },
                    { speaker: 'Chef', text: 'I can hand it over, but let\'s practise our manners. Form the correct sentence to ask for it!', char: 'chef' }
                ],
                builder: {
                    shuffled: ["please", "it", "to", "give", "me?", "Could", "you"],
                    correct: "Could you please give it to me?",
                    nextPass: 'evaluate',
                    nextFail: 'refectory_fail',
                    points: 10
                }
            },
            refectory_fail: {
                bg: 'refectory', char: 'chef2', bgColor: 'bg-red-900', charColor: 'bg-orange-500',
                dialogue: [
                    { speaker: 'Chef', text: 'Actually, you mean "Could you please give it to me?"' },
                    { speaker: 'Chef', text: 'But you tried your best! Here is the teacup.' }
                ],
                nextScene: 'evaluate'
            },
            success: {
                bg: 'manorHouse', char: 'receptionist', bgColor: 'bg-slate-800', charColor: 'bg-emerald-600',
                dialogue: [
                    { speaker: 'Ms. Davies', text: 'You found the teacup! Thank you so much for your help.' },
                    { speaker: 'Ms. Davies', text: 'Your English is wonderful, and your manners are [impeccable]. A true Lord or Lady!' },
                    { speaker: 'Ms. Davies', text: 'Please show the next screen to the Reception Desk to claim your special prize.' }
                ],
                nextScene: 'prize'
            },
            try_again: {
                bg: 'manorHouse', char: 'receptionist', bgColor: 'bg-slate-800', charColor: 'bg-emerald-600',
                dialogue: [
                    { speaker: 'Ms. Davies', text: 'You found the teacup! Thank you.' },
                    { speaker: 'Ms. Davies', text: 'But remember, being [polite] is important and takes practice. Why don\'t you try again and see if you can get a perfect score?' }
                ],
                nextScene: 'start_over'
            }
        };

        // ==========================================
        // 🚀 GAME STATE & LOGIC
        // ==========================================
        let currentScene = 'title';
        let dialogueIndex = 0;
        let score = 0;
        let isClaimed = false;

        // Modal States
        let activeModal = null; // { type: 'def'|'info', title: '', eng: '', jp: '' }
        let showJpTranslate = false;

        // Sentence Builder States
        let builderActive = false;
        let builderAvailable = [];
        let builderSelected = [];

        // Animation Tracking
        let lastRenderedBg = null;
        let lastRenderedChar = null;

        function startGame() {
            currentScene = 'start';
            dialogueIndex = 0;
            score = 0;
            lastRenderedBg = null;
            lastRenderedChar = null;
            render();
        }

        function claimPrize() {
            isClaimed = true;
            render();
        }

        function parseTextForDictionary(text) {
            // Replaces [Word] with a golden clickable span
            return text.replace(/\[([^\]]+)\]/g, `<span class="text-amber-600 font-bold underline cursor-pointer hover:text-amber-500" onclick="openDictionary('$1')">$1</span>`);
        }

        // --- Routing Logic ---
        function nextDialogue() {
            const scene = STORY[currentScene];
            
            if (dialogueIndex < scene.dialogue.length - 1) {
                dialogueIndex++;
                render();
            } else if (scene.builder) {
                // Initialize sentence builder
                builderActive = true;
                builderAvailable = [...scene.builder.shuffled];
                builderSelected = [];
                render();
            } else if (scene.nextScene) {
                handleNextRouting(scene.nextScene);
            }
        }

        function handleNextRouting(nextSceneId) {
            if (nextSceneId === 'start_over') {
                startGame();
            } else if (nextSceneId === 'evaluate') {
                // Check if they got all 50 points
                if (score >= 50) currentScene = 'success';
                else currentScene = 'try_again';
                dialogueIndex = 0;
                render();
            } else {
                currentScene = nextSceneId;
                dialogueIndex = 0;
                render();
            }
        }

        function makeChoice(nextScene, points) {
            score += points;
            handleNextRouting(nextScene);
        }

        // --- Sentence Builder Logic ---
        function selectWord(index) {
            const word = builderAvailable[index];
            builderAvailable.splice(index, 1);
            builderSelected.push(word);
            render();
        }

        function deselectWord(index) {
            const word = builderSelected[index];
            builderSelected.splice(index, 1);
            builderAvailable.push(word);
            render();
        }

        function submitBuilder() {
            const scene = STORY[currentScene];
            const answer = builderSelected.join(' ');
            builderActive = false; // Turn off builder UI

            if (answer === scene.builder.correct) {
                score += scene.builder.points;
                handleNextRouting(scene.builder.nextPass);
            } else {
                handleNextRouting(scene.builder.nextFail);
            }
        }

        // --- Modal Logic ---
        function openDictionary(word) {
            const data = DICTIONARY[word] || { eng: "Definition coming soon.", jp: "準備中" };
            activeModal = { type: 'def', title: word, eng: data.eng, jp: data.jp, justOpened: true };
            showJpTranslate = false;
            render();
        }

        function openLocationInfo() {
            const scene = STORY[currentScene];
            const data = LOCATION_INFO[scene.bg];
            if(data) {
                activeModal = { type: 'info', title: data.title, text: data.text, justOpened: true };
                render();
            }
        }

        function closeModal() {
            activeModal = null;
            render();
        }

        function toggleJapanese() {
            showJpTranslate = !showJpTranslate;
            if (activeModal) activeModal.justOpened = false;
            render();
        }

        // ==========================================
        // 🖼️ RENDERING ENGINE
        // ==========================================
        function render() {
            const app = document.getElementById('app');
            let html = '';

            // --- TITLE SCREEN ---
            if (currentScene === 'title') {
                lastRenderedBg = 'title';
                lastRenderedChar = null;
                html = `
                    <div class="w-full h-full bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center relative overflow-hidden animate-fade-in">
                        <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-amber-500 via-transparent to-transparent"></div>
                        <div class="z-10 bg-black/40 p-8 rounded-2xl border border-white/10 backdrop-blur-md shadow-2xl w-full max-w-md animate-pop-in">
                            <h2 class="text-amber-400 font-serif text-sm tracking-widest uppercase mb-3">British Hills English Quest</h2>
                            <h1 class="text-5xl font-bold mb-6 font-serif leading-tight drop-shadow-md">The Missing<br/>Teacup</h1>
                            <p class="text-gray-300 mb-8 mx-auto leading-relaxed">
                                Practice your English and help the staff find the missing antique. Tap highlighted words for help, and choose polite English to win!
                            </p>
                            <button onclick="startGame()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 px-10 rounded-full shadow-lg transition-transform transform active:scale-95 text-lg w-full">
                                Start Quest
                            </button>
                        </div>
                    </div>
                `;
            } 
            // --- PRIZE SCREEN ---
            else if (currentScene === 'prize') {
                lastRenderedBg = 'prize';
                lastRenderedChar = null;
                html = `
                    <div class="w-full h-full bg-gradient-to-b from-amber-600 to-amber-900 text-white flex flex-col items-center justify-center p-6 text-center animate-fade-in">
                        <svg class="w-24 h-24 mb-6 text-yellow-300 drop-shadow-lg" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3z"></path></svg>
                        <h1 class="text-4xl font-bold mb-2 font-serif">Congratulations!</h1>
                        <p class="text-xl mb-8">You completed the quest with perfect English manners.</p>
                        
                        <div class="bg-white/10 p-6 rounded-xl backdrop-blur-md border border-white/30 mb-8 w-full max-w-sm shadow-xl">
                            <p class="text-sm uppercase tracking-widest text-amber-200 mb-2 font-bold">Staff Instructions</p>
                            <p class="font-medium leading-relaxed">Please show this screen to the staff at the Manor House Reception Desk to claim your prize.</p>
                        </div>

                        ${!isClaimed ? `
                            <button onclick="claimPrize()" class="bg-green-600 text-white font-bold py-4 px-8 rounded-full shadow-lg hover:bg-green-500 transition-transform transform active:scale-95 border-2 border-green-400">
                                Staff Use Only: Mark as Claimed
                            </button>
                        ` : `
                            <div class="bg-black/40 px-8 py-4 rounded-full border-2 border-green-400 text-green-300 font-bold text-2xl animate-pulse">
                                Prize Claimed!
                            </div>
                        `}

                        <button onclick="startGame()" class="mt-12 text-amber-200 hover:text-white transition-colors underline flex items-center gap-2 font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Play Again
                        </button>
                    </div>
                `;
            } 
            // --- ACTIVE SCENE ---
            else {
                const scene = STORY[currentScene];
                const currentLine = scene.dialogue[dialogueIndex];
                const isLastLine = dialogueIndex === scene.dialogue.length - 1;
                const hasChoices = isLastLine && scene.choices && scene.choices.length > 0;
                
                const bgImage = ASSETS.backgrounds[scene.bg];
                const currentCharKey = currentLine.char || scene.char;
                const charImage = ASSETS.characters[currentCharKey];

                const isNewBg = lastRenderedBg !== scene.bg;
                const isNewChar = isNewBg || lastRenderedChar !== currentCharKey;
                
                lastRenderedBg = scene.bg;
                lastRenderedChar = currentCharKey;

                const bgAnim = isNewBg ? 'animate-fade-in' : '';
                const charAnim = isNewChar ? 'animate-slide-up' : '';
                const boxAnim = isNewBg ? 'animate-pop-in' : '';

                // HTML Construction
                const bgHtml = bgImage 
                    ? `<img src="${bgImage}" class="absolute inset-0 w-full h-full object-cover ${bgAnim}" />`
                    : `<div class="absolute inset-0 ${scene.bgColor} flex flex-col items-center justify-center opacity-80 ${bgAnim}"><div class="bg-black/60 px-6 py-2 rounded-full text-white font-mono shadow-lg">${scene.bg}</div></div>`;

                const charHtml = charImage
                    ? `<img src="${charImage}" class="absolute bottom-0 left-1/2 transform -translate-x-1/2 max-w-md h-[70%] object-contain ${charAnim}" />`
                    : `<div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-[60%] max-w-xs h-[65%] ${scene.charColor} rounded-t-full flex flex-col items-center justify-start pt-16 shadow-2xl border-4 border-b-0 border-white/20 ${charAnim}"><div class="bg-black/50 px-4 py-1 rounded text-white font-mono text-sm">${currentCharKey}</div></div>`;

                // Render Input Methods (Choices vs Builder vs Next)
                let inputHtml = '';
                if (builderActive) {
                    // SENTENCE BUILDER UI
                    inputHtml = `
                        <div class="mt-4 border-t border-gray-200 pt-4 animate-fade-in">
                            <p class="text-sm text-gray-500 mb-2 font-bold uppercase tracking-wider text-center">Tap words to build your sentence</p>
                            
                            <!-- Answer Slot -->
                            <div class="bg-gray-100 p-3 rounded-xl border-2 border-dashed border-gray-300 min-h-[56px] flex flex-wrap gap-2 mb-4 items-center justify-center">
                                ${builderSelected.length === 0 ? '<span class="text-gray-400">...</span>' : ''}
                                ${builderSelected.map((w, i) => `<button onclick="deselectWord(${i})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg shadow-md font-medium transition-transform active:scale-95">${w}</button>`).join('')}
                            </div>
                            
                            <!-- Word Bank -->
                            <div class="flex flex-wrap gap-2 justify-center mb-4">
                                ${builderAvailable.map((w, i) => `<button onclick="selectWord(${i})" class="bg-white hover:bg-gray-50 border-2 border-gray-200 px-3 py-1.5 rounded-lg shadow-sm text-gray-700 font-medium transition-transform active:scale-95">${w}</button>`).join('')}
                            </div>

                            <button onclick="submitBuilder()" class="${builderAvailable.length === 0 ? 'bg-amber-600 hover:bg-amber-500' : 'bg-gray-300 pointer-events-none'} text-white font-bold py-3 w-full rounded-xl shadow-md transition-colors">Submit Sentence</button>
                        </div>
                    `;
                } else if (hasChoices) {
                    // STANDARD MULTIPLE CHOICE
                    inputHtml = `<div class="flex flex-col gap-3 mt-4">`;
                    scene.choices.forEach(choice => {
                        inputHtml += `
                            <button onclick="makeChoice('${choice.next}', ${choice.points})" class="w-full text-left bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 p-4 rounded-xl transition-colors font-medium text-blue-900 flex items-center justify-between group shadow-sm active:bg-blue-200">
                                <span class="pr-4">${choice.text}</span>
                                <svg class="w-6 h-6 text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        `;
                    });
                    inputHtml += `</div>`;
                } else {
                    // NEXT BUTTON
                    inputHtml = `
                        <div class="flex justify-end mt-2">
                            <button onclick="nextDialogue()" class="bg-amber-600 hover:bg-amber-500 text-white px-8 py-3 rounded-xl flex items-center gap-2 font-bold transition-transform transform active:scale-95 shadow-md border border-amber-700">
                                Next <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        </div>
                    `;
                }

                // Render Active Modal (if any)
                let modalHtml = '';
                if (activeModal) {
                    const modalBgAnim = activeModal.justOpened ? 'animate-fade-in' : '';
                    const modalBoxAnim = activeModal.justOpened ? 'animate-pop-in' : '';

                    if (activeModal.type === 'def') {
                        modalHtml = `
                            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm ${modalBgAnim}" onclick="closeModal()">
                                <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl relative ${modalBoxAnim}" onclick="event.stopPropagation()">
                                    <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                    
                                    <h3 class="text-2xl font-serif font-bold text-amber-700 mb-4 capitalize">${activeModal.title}</h3>
                                    <p class="text-gray-700 mb-6 leading-relaxed">${activeModal.eng}</p>
                                    
                                    <div class="border-t border-gray-100 pt-4 flex items-center justify-between">
                                        <span class="text-sm font-bold text-gray-500 uppercase tracking-wider">Reveal Japanese</span>
                                        <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                                            <input type="checkbox" name="toggle" id="toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" onclick="toggleJapanese()" ${showJpTranslate ? 'checked' : ''}/>
                                            <label for="toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                        </div>
                                    </div>
                                    
                                    ${showJpTranslate ? `<div class="mt-4 p-3 bg-emerald-50 rounded-lg border border-emerald-100 text-emerald-800 font-bold text-center animate-fade-in">${activeModal.jp}</div>` : ''}
                                </div>
                            </div>
                        `;
                    } else if (activeModal.type === 'info') {
                        modalHtml = `
                            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm ${modalBgAnim}" onclick="closeModal()">
                                <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl relative border-t-4 border-amber-600 ${modalBoxAnim}" onclick="event.stopPropagation()">
                                    <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                    <h3 class="text-2xl font-serif font-bold text-amber-800 mb-3">${activeModal.title}</h3>
                                    <p class="text-gray-700 leading-relaxed">${parseTextForDictionary(activeModal.text)}</p>
                                </div>
                            </div>
                        `;
                    }
                }

                html = `
                    <div class="w-full h-full relative">
                        ${bgHtml}
                        ${charHtml}
                        
                        <!-- Top HUD -->
                        <div class="absolute top-4 left-4 z-20 ${bgAnim}">
                            <div class="bg-black/60 text-amber-300 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 backdrop-blur-md shadow-lg">
                                <svg class="w-4 h-4 fill-amber-300" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                ${score} pts
                            </div>
                        </div>

                        <div class="absolute top-4 right-4 z-20 ${bgAnim}">
                            <button onclick="openLocationInfo()" class="bg-white/90 text-amber-700 hover:bg-white p-2 rounded-full shadow-lg backdrop-blur-md transition-transform active:scale-95 border border-amber-200">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </button>
                        </div>

                        <!-- Dialogue Box -->
                        <div class="absolute bottom-4 left-4 right-4 z-20 flex flex-col items-center">
                            <div class="w-full max-w-2xl relative bg-white/95 text-gray-900 p-5 pt-8 rounded-xl shadow-2xl border-2 border-amber-700 backdrop-blur-sm ${boxAnim}">
                                <div class="absolute -top-4 left-4 bg-gradient-to-r from-blue-900 to-blue-800 text-white px-5 py-1.5 rounded-md shadow-md border border-amber-500 font-bold tracking-wide">
                                    ${currentLine.speaker}
                                </div>
                                <div class="text-[1.1rem] leading-relaxed mb-4 min-h-[4rem] font-medium text-gray-800">
                                    ${parseTextForDictionary(currentLine.text)}
                                </div>
                                ${inputHtml}
                            </div>
                        </div>
                        
                        ${modalHtml}
                    </div>
                `;
            }

            app.innerHTML = html;
        }

        // Initialize on load
        window.onload = render;
    </script>
</body>
</html>
